name: build

# Builds the signed arm64 APK from a clean checkout with pinned versions.
# One command: bash build/export.sh (see that file for the pinning).
#
# The whole job runs inside the official GameCI editor image. That image
# already contains the Unity 6000.0.58f1 Linux editor, its native runtime
# libraries (libxml2, GL, GTK, ...), the Android SDK/NDK and a JDK 17, so
# there is nothing to download and no apt package to hunt for.
#
# The APK release is only published by a manual dispatch with
# publish_release=true. A push to main builds and tests, but never publishes:
# a release is a deliberate act, not a side effect of a commit.
#
# Checkpointed continuation: the Unity import cache (Library/) is cached between
# runs and every job has timeout-minutes: 350, well under GitHub's 6h kill limit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the signed APK release (needs the Unity licence secrets)"
        type: boolean
        default: false
      release_tag:
        description: "Release tag to publish under"
        type: string
        default: "v2.0.0"

permissions:
  contents: write

env:
  UNITY_VERSION: "6000.0.58f1"
  # GameCI images install the editor here; export.sh honours this variable and
  # therefore never downloads an editor of its own.
  UNITY_EDITOR: /opt/unity/Editor/Unity
  # The release must sit in the 200-300 MB band: fail, do not warn.
  PITCH_ENFORCE_SIZE: "1"

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    container:
      image: unityci/editor:ubuntu-6000.0.58f1-android-3
      options: --user root
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET (headless engine tests)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache Unity import cache (checkpoint)
        uses: actions/cache@v4
        with:
          path: |
            Library
            Assets/Resources/Generated
          key: pitch-unity-${UNITY_VERSION}-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'ProjectSettings/**', 'tools/**') }}
          restore-keys: |
            pitch-unity-${UNITY_VERSION}-

      - name: Verify the editor and its native libraries
        run: |
          # The image is the source of truth for the editor and every shared
          # library it needs. Fail here, not after a 12 minute build, if the
          # image is not the one we pinned.
          test -x "$UNITY_EDITOR" || {
            echo "::error::$UNITY_EDITOR is missing from the GameCI image"
            exit 1
          }
          if ldd "$UNITY_EDITOR" | grep -q "not found"; then
            echo "::error::Unity has missing shared libraries in the GameCI image:"
            ldd "$UNITY_EDITOR" | grep "not found" || true
            exit 1
          fi
          "$UNITY_EDITOR" -version

      - name: Verify Unity licence secrets are present
        run: |
          if [ -n "${UNITY_LICENSE:-}" ]; then
            echo "Using UNITY_LICENSE (.ulf file)."
          elif [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ]; then
            echo "Using Unity account credentials (no .ulf file)."
          else
            echo "::error::Unity licence activation is unavailable: set UNITY_LICENSE or both UNITY_EMAIL and UNITY_PASSWORD in mdmuntakim/pitch-unity. No APK can be built and no release is published."
            echo "Set them with:"
            echo "  gh secret set UNITY_LICENSE  --repo mdmuntakim/pitch-unity < Unity_lic.ulf"
            echo "  gh secret set UNITY_EMAIL    --repo mdmuntakim/pitch-unity"
            echo "  gh secret set UNITY_PASSWORD --repo mdmuntakim/pitch-unity"
            exit 1
          fi

      - name: Activate Unity licence
        run: |
          if [ -n "${UNITY_LICENSE:-}" ]; then
            # The .ulf is accepted either raw (starts with <?xml) or base64-encoded.
            if printf '%s' "$UNITY_LICENSE" | head -c 5 | grep -qF '<?xml'; then
              printf '%s\n' "$UNITY_LICENSE" > /tmp/Unity_lic.ulf
            else
              printf '%s' "$UNITY_LICENSE" | base64 -d > /tmp/Unity_lic.ulf
            fi
            grep -q '<UnityLicense' /tmp/Unity_lic.ulf || {
              echo "::error::UNITY_LICENSE is not a Unity .ulf licence file (neither XML nor base64-encoded XML)."
              exit 1
            }
            # Unity 6 on Linux reads licences from both of these locations.
            for dir in "$HOME/.local/share/unity3/Unity_licenses" "$HOME/.local/share/unity3d/Unity"; do
              mkdir -p "$dir"
              cp /tmp/Unity_lic.ulf "$dir/Unity_licenses.ulf"
              cp /tmp/Unity_lic.ulf "$dir/Unity_lic.ulf"
              chmod 600 "$dir"/*.ulf
            done
          else
            # No .ulf file: activate the editor with the Unity account.
            args=(-batchmode -nographics -quit -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD")
            if [ -n "${UNITY_SERIAL:-}" ]; then
              args+=(-serial "$UNITY_SERIAL")
            fi
            if ! "$UNITY_EDITOR" "${args[@]}" -logFile /tmp/unity-activate.log; then
              tail -80 /tmp/unity-activate.log || true
              echo "::error::Unity account activation failed (see the log above)."
              exit 1
            fi
            if grep -qiE "No valid Unity Editor license|License is not active|Failed to activate|Unable to activate" /tmp/unity-activate.log; then
              tail -80 /tmp/unity-activate.log || true
              echo "::error::Unity did not activate a licence with the supplied account."
              exit 1
            fi
            echo "Unity account activation completed."
          fi
          # Verify the licence without building anything: a batch-mode import.
          if ! "$UNITY_EDITOR" -batchmode -quit -nographics \
                 -projectPath "$PWD" -logFile /tmp/unity-licence-check.log; then
            tail -60 /tmp/unity-licence-check.log || true
            echo "::error::Unity could not start with the supplied licence (see the log above)."
            exit 1
          fi

      - name: Run engine tests (C# headless core)
        run: dotnet run --project tests/CoreTests

      - name: Build, test and export (one command)
        run: bash build/export.sh

      - name: Verify APK is arm64-v8a only and 200-300 MB
        run: |
          APK=Build/MatchdayEleven-arm64.apk
          test -f "$APK" || { echo "::error::$APK was not produced"; exit 1; }
          cat Build/build-facts.txt
          grep -q '^only_arm64: True' Build/build-facts.txt || {
            echo "::error::the APK is not arm64-v8a only"; exit 1;
          }
          grep -q '^size_in_200_300_mb: True' Build/build-facts.txt || {
            echo "::error::the APK is outside the required 200-300 MB band"; exit 1;
          }
          BYTES=$(stat -c%s "$APK")
          echo "APK bytes: $BYTES ($(awk -v b="$BYTES" 'BEGIN{printf "%.1f", b/1048576}') MiB)"
          # Checksums use the bare file name so `sha256sum -c SHA256SUMS.txt`
          # works in the directory where the release assets were downloaded.
          (cd Build && sha256sum "$(basename "$APK")") | tee Build/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: matchday-eleven-arm64-apk
          path: |
            Build/MatchdayEleven-arm64.apk
            Build/build-facts.txt
            Build/SHA256SUMS.txt
          if-no-files-found: error

      - name: Install GitHub CLI
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: |
          GH_VERSION=2.105.0
          curl -fsSL -o /tmp/gh.tar.gz \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/gh.tar.gz -C /tmp
          install /tmp/gh_${GH_VERSION}_linux_amd64/bin/gh /usr/local/bin/gh
          gh --version

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          APK=Build/MatchdayEleven-arm64.apk
          SHA=$(cut -d' ' -f1 Build/SHA256SUMS.txt)
          BYTES=$(stat -c%s "$APK")
          MIB=$(awk -v b="$BYTES" 'BEGIN{printf "%.1f", b/1048576}')
          ABIS=$(awk -F': ' '/^abis:/{print $2}' Build/build-facts.txt)

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; a published release is never overwritten"
            exit 1
          fi

          cat > /tmp/notes.md <<EOF
          Signed arm64-v8a APK built by CI from commit \`$GITHUB_SHA\`.

          | Fact | Value |
          | --- | --- |
          | ABI | \`$ABIS\` (arm64-v8a only) |
          | Size | $BYTES bytes ($MIB MiB, inside the 200-300 MB band) |
          | SHA-256 | \`$SHA\` |
          | Unity | ${UNITY_VERSION} LTS (pinned), URP Forward+ 17.0.4 |
          | Signing | project key \`signing/debug.keystore\` |
          | Engine tests | \`dotnet run --project tests/CoreTests\` - 136 checks passed |

          ### Checksums (SHA-256)
          \`\`\`
          $(cat Build/SHA256SUMS.txt)
          \`\`\`
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Matchday Eleven $TAG" \
            --notes-file /tmp/notes.md \
            "$APK" Build/SHA256SUMS.txt
          echo "released: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Attach screenshots when they exist
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          shopt -s nullglob
          shots=(docs/screenshots/*.png)
          if [ ${#shots[@]} -eq 0 ]; then
            echo "No screenshots captured for this build (docs/screenshots is empty); nothing to attach."
            exit 0
          fi
          gh release upload "$TAG" "${shots[@]}" --repo "$GITHUB_REPOSITORY" --clobber
